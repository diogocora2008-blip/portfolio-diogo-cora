
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-dark">
    <div class="container">
        <span class="navbar-brand text-white">Meu IMC</span>
    </div>
</nav>

<main class="container py-4">
    <h1 class="text-center mb-4">Calculadora de IMC</h1>

    <div class="card mx-auto mb-5" style="max-width:450px">
        <div class="card-body">
            <label for="peso" class="form-label">Peso (kg)</label>
            <input type="number" id="peso" class="form-control mb-3" placeholder="Ex.: 70">

            <label for="altura" class="form-label">Altura (m)</label>
            <input type="number" id="altura" class="form-control mb-3" placeholder="Ex.: 1.75" step="0.01">

            <button class="btn btn-primary w-100" onclick="calcular()">Calcular</button>
            <div id="resultado" class="mt-3"></div>
        </div>
    </div>

    <h2 class="text-center mb-3">Tabela de IMC</h2>

    <table class="table table-bordered table-striped text-center">
        <tr><th>IMC</th><th>Classificação</th></tr>
        <tr><td>Abaixo de 18,5</td><td>Baixo peso</td></tr>
        <tr><td>18,5 a 24,9</td><td>Peso normal</td></tr>
        <tr><td>25 a 29,9</td><td>Sobrepeso</td></tr>
        <tr><td>30 a 34,9</td><td>Obesidade grau I</td></tr>
        <tr><td>35 a 39,9</td><td>Obesidade grau II</td></tr>
        <tr><td>40 ou mais</td><td>Obesidade grau III</td></tr>
    </table>
</main>

<footer class="bg-dark text-white text-center p-3">
    &copy; 2026 - Meu IMC
</footer>

<script>
function calcular() {
    const peso = Number(document.getElementById("peso").value);
    const altura = Number(document.getElementById("altura").value);
    const resultado = document.getElementById("resultado");

    if (peso <= 0 || altura <= 0 ||
        document.getElementById("peso").value === "" ||
        document.getElementById("altura").value === "") {
        resultado.innerHTML = '<div class="alert alert-danger">Digite valores válidos.</div>';
        return;
    }

    const imc = peso / (altura * altura);
    let texto, cor;

    if (imc < 18.5) {
        texto = "Baixo peso"; cor = "info";
    } else if (imc < 25) {
        texto = "Peso normal"; cor = "success";
    } else if (imc < 30) {
        texto = "Sobrepeso"; cor = "warning";
    } else if (imc < 35) {
        texto = "Obesidade grau I"; cor = "warning";
    } else if (imc < 40) {
        texto = "Obesidade grau II"; cor = "danger";
    } else {
        texto = "Obesidade grau III"; cor = "danger";
    }

    resultado.innerHTML = `<div class="alert alert-${cor}">
        <strong>IMC:</strong> ${imc.toFixed(2)}<br>
        <strong>Classificação:</strong> ${texto}
    </div>`;
}
</script>

</body>
</html>

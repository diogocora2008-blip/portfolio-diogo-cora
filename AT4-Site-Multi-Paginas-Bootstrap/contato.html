

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | História dos Videogames</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            GameHistória
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir ou fechar o menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="sobre.html">Sobre</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="galeria.html">Galeria</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dados.html">Dados</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page"
                       href="contato.html">Contato</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">

            <h1 class="mb-3">Entre em contato</h1>

            <p class="mb-4">
                Envie uma mensagem ou compartilhe sua opinião
                sobre a história dos videogames.
            </p>

            <div class="formulario">
                <form id="formContato">

                    <div class="mb-3">
                        <label for="nome" class="form-label">
                            Nome completo
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            E-mail
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="exemplo@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="assunto" class="form-label">
                            Assunto
                        </label>
                        <select
                            class="form-select"
                            id="assunto"
                            name="assunto"
                            required
                        >
                            <option value="" selected disabled>
                                Selecione um assunto
                            </option>
                            <option value="historia">
                                História dos videogames
                            </option>
                            <option value="consoles">
                                Consoles e jogos
                            </option>
                            <option value="sugestao">
                                Sugestão para o site
                            </option>
                            <option value="outro">
                                Outro assunto
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="mensagem" class="form-label">
                            Mensagem
                        </label>
                        <textarea
                            class="form-control"
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Escreva sua mensagem"
                            required
                        ></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="autorizacao"
                            required
                        >
                        <label class="form-check-label" for="autorizacao">
                            Confirmo que revisei as informações.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Enviar mensagem
                    </button>

                    <p
                        id="resultado"
                        class="mt-3 mb-0"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>
            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 mt-4">
    <div class="container">
        <p class="mb-1">
            Projeto acadêmico — História dos Videogames
        </p>
        <p class="mb-0">
            Explorando a evolução dos jogos e consoles.
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("formContato").addEventListener(
        "submit",
        function(event) {
            event.preventDefault();

            document.getElementById("resultado").textContent =
                "Demonstração concluída! Nenhum e-mail foi enviado.";

            this.reset();
        }
    );
</script>

</body>
</html>
